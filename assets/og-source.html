<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>AURELIUS — превью</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Manrope:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative;
      background:
        radial-gradient(700px 500px at 78% 18%, rgba(122, 90, 248, 0.22), transparent 62%),
        radial-gradient(600px 460px at 8% 92%, rgba(75, 47, 168, 0.18), transparent 64%),
        #07060a;
      color: #f2efe8;
      font-family: "Manrope", "Segoe UI", Arial, sans-serif;
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 74px 74px;
      mask-image: radial-gradient(circle at 55% 45%, #000 0%, transparent 74%);
      -webkit-mask-image: radial-gradient(circle at 55% 45%, #000 0%, transparent 74%);
    }
    .frame {
      position: absolute;
      inset: 26px;
      border: 1px solid rgba(201, 169, 106, 0.28);
      padding: 42px 50px 36px;
      display: flex;
      flex-direction: column;
    }
    .frame::before, .frame::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      border: 1px solid #c9a96a;
      opacity: .6;
    }
    .frame::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
    .frame::after { right: -1px; bottom: -1px; border-top: 0; border-left: 0; }

    .top { display: flex; align-items: center; gap: 14px; }
    .mark { width: 36px; height: 36px; color: #c9a96a; }
    .brand-name { font-size: 14px; font-weight: 600; letter-spacing: .34em; line-height: 1; }
    .brand-sub { margin-top: 5px; color: #8a8297; font-size: 8px; letter-spacing: .28em; text-transform: uppercase; }

    .main {
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      gap: 44px;
      align-items: center;
      flex: 1;
      padding-top: 6px;
    }
    .rule { width: 58px; height: 1px; background: #c9a96a; opacity: .7; margin-bottom: 20px; }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 88px;
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: .9;
    }
    h1 em { color: #e6d3a3; font-style: italic; font-weight: 300; }
    .lead {
      max-width: 430px;
      margin-top: 24px;
      color: #b8b1c3;
      font-size: 15px;
      font-weight: 300;
      line-height: 1.7;
    }
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: #8a8297;
      font-size: 8.5px;
      letter-spacing: .26em;
      text-transform: uppercase;
    }
    .bottom strong { color: #c9a96a; font-weight: 500; }
    .chart { position: relative; }
    .chart svg { width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="frame">
    <div class="top">
      <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M24 3 45 24 24 45 3 24 24 3Z" stroke="currentColor" stroke-width="1"/>
        <path d="M24 11 37 24 24 37 11 24 24 11Z" stroke="currentColor" stroke-width="1" opacity=".45"/>
        <path d="M24 16v16M16 24h16" stroke="currentColor" stroke-width="1"/>
      </svg>
      <div>
        <div class="brand-name">AURELIUS</div>
        <div class="brand-sub">Private Trading Club</div>
      </div>
    </div>

    <div class="main">
      <div>
        <div class="rule"></div>
        <h1>Капитал любит<br><em>тишину.</em></h1>
        <p class="lead">Закрытый торговый клуб. Не сигналы, а система: вход, стоп и доля риска — до сделки.</p>
      </div>

      <div class="chart">
        <svg viewBox="0 0 520 340" role="img" aria-label="График">
          <defs>
            <linearGradient id="ogArea" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#7a5af8" stop-opacity=".30"/>
              <stop offset="100%" stop-color="#7a5af8" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="ogLine" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#8a6b34"/>
              <stop offset="50%" stop-color="#e6d3a3"/>
              <stop offset="100%" stop-color="#c9a96a"/>
            </linearGradient>
          </defs>
          <g stroke="#ffffff" stroke-opacity=".06">
            <line x1="0" y1="60" x2="520" y2="60"/>
            <line x1="0" y1="130" x2="520" y2="130"/>
            <line x1="0" y1="200" x2="520" y2="200"/>
            <line x1="0" y1="270" x2="520" y2="270"/>
          </g>
          <g stroke="#ffffff" stroke-opacity=".035">
            <line x1="104" y1="0" x2="104" y2="340"/>
            <line x1="208" y1="0" x2="208" y2="340"/>
            <line x1="312" y1="0" x2="312" y2="340"/>
            <line x1="416" y1="0" x2="416" y2="340"/>
          </g>
          <path d="M0 300 C28 298 44 284 70 288 C96 292 108 264 136 268 C164 272 178 242 206 248 C234 254 250 214 278 202 C306 190 324 210 352 184 C380 158 398 166 426 138 C454 110 480 118 504 92 C512 84 516 82 520 80 L520 340 L0 340 Z" fill="url(#ogArea)"/>
          <path d="M0 300 C28 298 44 284 70 288 C96 292 108 264 136 268 C164 272 178 242 206 248 C234 254 250 214 278 202 C306 190 324 210 352 184 C380 158 398 166 426 138 C454 110 480 118 504 92 C512 84 516 82 520 80" fill="none" stroke="url(#ogLine)" stroke-width="2.2" stroke-linecap="round"/>
          <g fill="#07060a" stroke="#e6d3a3" stroke-width="1.6">
            <circle cx="136" cy="268" r="4"/>
            <circle cx="278" cy="202" r="4"/>
            <circle cx="426" cy="138" r="4"/>
          </g>
        </svg>
      </div>
    </div>

    <div class="bottom">
      <span><strong>AURELIUS</strong> · Private Trading Club</span>
      <span>Доступ по заявке</span>
    </div>
  </div>
</body>
</html>
